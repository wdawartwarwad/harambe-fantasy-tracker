name: Refresh BMW Championship leaderboard

on:
  schedule:
    - cron: "0 12-23 20-23 8 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch leaderboard and rewrite index.html
        env:
          SLASHGOLF_KEY: ${{ secrets.SLASHGOLF_KEY }}
        run: python scripts/update_leaderboard.py

      - name: Commit and push if index.html changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes to index.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Auto-refresh leaderboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
